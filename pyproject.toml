[project]
name = "Host"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy==1.23",
  "torch==1.10.0+cu113; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "tensorboard",
  "tqdm",
  "seaborn",
  "setuptools==59.5.0",
]

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[tool.uv.sources]
torch = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"},
]
