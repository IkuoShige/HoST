[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "host"
version = "0.2.0"
description = "HoST: Humanoid Standing-up Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mjlab"]

# This is the core plugin mechanism: when mjlab is imported, it auto-discovers
# and loads entry points in the "mjlab.tasks" group. This causes host_mjlab
# to be imported, which registers the standing-up task.
[project.entry-points."mjlab.tasks"]
host_standing_up = "host_mjlab"

[tool.uv.sources]
mjlab = { path = "../mjlab", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/host_mjlab"]
